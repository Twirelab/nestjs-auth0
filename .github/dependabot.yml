version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "1.x"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "1.x"
    schedule:
      interval: "weekly"
